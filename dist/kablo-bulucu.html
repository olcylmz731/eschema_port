<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1216">
<title>Kablo Bulucu</title>
<script>
/* Erken tema: kayıtlı tercih varsa ilk boyamadan önce uygulanır (ışık parlaması olmasın). localStorage hata verebilir. */
(function () {
  try {
    var t = localStorage.getItem('kb-tema');
    if (t === 'acik' || t === 'koyu') document.documentElement.setAttribute('data-tema', t);
  } catch (e) { /* dosya yöneticisinden açılışta erişim olmayabilir */ }
})();
</script>
<style>
/* ---- src/tokens.css ---- */
/* ==========================================================================
   Kablo Bulucu — TOKENLAR (tek kaynak)
   --------------------------------------------------------------------------
   * Başka hiçbir dosya renk, boyut ya da yazı tipi uydurmaz; yalnız var(--...).
   * Tema: <html data-tema="acik|koyu">. Öznitelik yoksa sistem tercihi
     (sistem açık diyorsa açık), sinyal yoksa KOYU.
   * Kural: satır başına TEK tanım; açıklama satır sonu yorumudur.
     test/kontrast.mjs ve DESIGN.md tabloları bu dosyadan üretilir.
   * 3. blok ile 4. blok birebir aynı olmalı (kontrast.mjs denetler).
   * Bilerek KULLANILMAYAN CSS (eski Android Chrome/WebView'de yok):
     light-dark(), color-mix(), :has(), iç içe CSS, @layer, dvh.
   * Büyük harfli etiketleri (ŞÜPHELİ...) CSS text-transform ile değil, doğrudan
     büyük harfle yaz; <html lang="tr"> şart (i/İ tuzağı).
   ========================================================================== */


/* ==========================================================================
   1. ORTAK — temadan bağımsız
   ========================================================================== */
:root {
  /* --- Yazı tipleri: yalnız sistem fontları --- */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif; /* arayüz yazısı */
  --font-kod: ui-monospace, "Roboto Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; /* kod, pin, soket, kablo no */

  /* --- Yazı ölçeği (rem: 1rem = 16 px; kullanıcının yazı boyutu ayarına uyar) --- */
  --boyut-ipucu: 0.875rem; /* 14 px, EN KÜÇÜK yazı: rozet, dipnot, kaynak satırı */
  --boyut-govde: 1rem; /* 16 px, gövde, tablo, düğme */
  --boyut-pin: 1.125rem; /* 18 px, pin / soket / pin adı etiketi (mono) */
  --boyut-kod: 1.25rem; /* 20 px, cihaz kodu ve kablo no (mono, kalın) */
  --boyut-baslik: 1.5rem; /* 24 px, bölüm başlığı */
  --boyut-ekran: 1.75rem; /* 28 px, ekran başlığı */
  --boyut-vurgu: 2.125rem; /* 34 px, kart tepesindeki kablo no */
  --satir-sik: 1.25; /* satır yüksekliği: başlık, kod */
  --satir-tablo: 1.35; /* satır yüksekliği: tablo hücresi, rozet */
  --satir-govde: 1.5; /* satır yüksekliği: gövde metni */
  --agirlik-normal: 400; /* normal yazı */
  --agirlik-orta: 500; /* ikincil vurgu (Roboto'da 500 var; mono'da 400'e düşer) */
  --agirlik-kalin: 700; /* başlık, kod, rozet */
  --harf-etiket: 0.04em; /* BÜYÜK HARFLİ etiket aralığı */
  --harf-kod: 0.02em; /* mono kod aralığı (1/l/I ayrımı için) */

  /* --- Aralık (4 px tabanı) --- */
  --bosluk-1: 4px; /* en dar boşluk */
  --bosluk-2: 8px; /* çip içi, dokunma hedefleri arası */
  --bosluk-3: 12px; /* kart içi dikey */
  --bosluk-4: 16px; /* sayfa kenarı, kart dolgusu */
  --bosluk-5: 20px; /* bölüm içi */
  --bosluk-6: 24px; /* bölüm arası */
  --bosluk-8: 32px; /* büyük bölüm arası */
  --bosluk-10: 40px; /* ekran başı/sonu */
  --bosluk-12: 48px; /* en geniş boşluk */

  /* --- Köşe yarıçapı, çerçeve --- */
  --yaricap-s: 4px; /* rozet, küçük çip */
  --yaricap-m: 8px; /* düğme, girdi, kart */
  --yaricap-b: 12px; /* alt sayfa, büyük kart */
  --yaricap-tam: 999px; /* hap biçimi (sekme çipi) */
  --cerceve-ince: 1px; /* yalnız ayırıcı satır */
  --cerceve: 2px; /* varsayılan çerçeve */
  --cerceve-kalin: 3px; /* beyin, ŞÜPHELİ, odak halkası */

  /* --- Dokunma ve yerleşim --- */
  --dokunma: 48px; /* en küçük dokunma hedefi */
  --dokunma-buyuk: 56px; /* ana düğme, arama alanı, liste satırı */
  --dokunma-aralik: 8px; /* iki hedef arası en az boşluk */
  --kenar: 16px; /* sayfanın sağ/sol boşluğu */
  --icerik-azami: 960px; /* geniş ekranda içerik genişliği */
  --simge-kucuk: 20px; /* rozet içi simge */
  --simge: 24px; /* varsayılan simge */
  --tur-boyut: 40px; /* cihaz türü işareti (çerçeve + glif) */
  --odak-kalinlik: 3px; /* odak halkası kalınlığı */
  --odak-bosluk: 2px; /* odak halkası ile öğe arası */

  /* --- Kablo çizgisi --- */
  --kablo-kalinlik: 3px; /* düz kablo çizgisi */
  --kablo-tup: 9px; /* renkli kablonun dış çapı (kenar dahil) */
  --kablo-ic: 5px; /* renkli kablonun iç şeridi */
  --kablo-kesik: 10 6; /* varyant: stroke-dasharray */
  --kablo-cizgi: var(--cizgi-guclu); /* kablo çizgisi ve kenarı */

  /* --- Hareket --- */
  --sure-hizli: 100ms; /* basma geri bildirimi */
  --sure: 180ms; /* geçişler */
  --egri: cubic-bezier(0.2, 0, 0, 1); /* ivme eğrisi */

  /* --- Kablo renkleri (gerçek renk, temaya göre DEĞİŞMEZ; hep kenarlı ve yazılı) --- */
  --kablo-ws: #F2F2EE; /* ws beyaz */
  --kablo-sw: #17191C; /* sw siyah */
  --kablo-rt: #D8212E; /* rt kırmızı */
  --kablo-gn: #1E9E45; /* gn yeşil */
  --kablo-ge: #F2C200; /* ge sarı */
  --kablo-bl: #2063D0; /* bl mavi */
  --kablo-br: #7C4A22; /* br kahverengi */
  --kablo-gr: #8B9096; /* gr gri */
  --kablo-li: #8B52C4; /* li lila */
  --kablo-or: #F28A0C; /* or turuncu */
  --kablo-rs: #F29BBB; /* rs pembe */

  /* --- Cihaz türü: çerçeve rengi ve iç dolgu (renk yalnız destek; asıl ayrım çerçeve + glif + yazı) --- */
  --tur-beyin: var(--ton-mavi); /* beyin: çerçeve */
  --tur-beyin-zemin: var(--ton-mavi-zemin); /* beyin: dolgu */
  --tur-soket: var(--ton-celik); /* soket */
  --tur-soket-zemin: var(--ton-celik-zemin); /* soket dolgu */
  --tur-besleme: var(--ton-gul); /* artı besleme */
  --tur-besleme-zemin: var(--ton-gul-zemin); /* artı besleme dolgu */
  --tur-guc: var(--ton-gul); /* güç (akü, alternatör) */
  --tur-guc-zemin: var(--ton-gul-zemin); /* güç dolgu */
  --tur-salter: var(--ton-turuncu); /* şalter */
  --tur-salter-zemin: var(--ton-turuncu-zemin); /* şalter dolgu */
  --tur-role: var(--ton-turuncu); /* röle */
  --tur-role-zemin: var(--ton-turuncu-zemin); /* röle dolgu */
  --tur-sigorta: var(--ton-turuncu); /* sigorta */
  --tur-sigorta-zemin: var(--ton-turuncu-zemin); /* sigorta dolgu */
  --tur-toprak: var(--ton-kahve); /* toprak */
  --tur-toprak-zemin: var(--ton-kahve-zemin); /* toprak dolgu */
  --tur-motor: var(--ton-zeytin); /* motor */
  --tur-motor-zemin: var(--ton-zeytin-zemin); /* motor dolgu */
  --tur-valf: var(--ton-zeytin); /* valf */
  --tur-valf-zemin: var(--ton-zeytin-zemin); /* valf dolgu */
  --tur-lamba: var(--ton-sari); /* lamba */
  --tur-lamba-zemin: var(--ton-sari-zemin); /* lamba dolgu */
  --tur-ikaz: var(--ton-sari); /* ikaz (uyarı lambası, korna, zil) */
  --tur-ikaz-zemin: var(--ton-sari-zemin); /* ikaz dolgu */
  --tur-sensor: var(--ton-turkuaz); /* sensör */
  --tur-sensor-zemin: var(--ton-turkuaz-zemin); /* sensör dolgu */
  --tur-direnc: var(--ton-celik); /* direnç */
  --tur-direnc-zemin: var(--ton-celik-zemin); /* direnç dolgu */
  --tur-diyot: var(--ton-celik); /* diyot */
  --tur-diyot-zemin: var(--ton-celik-zemin); /* diyot dolgu */
  --tur-dugum: var(--ton-celik); /* düğüm (ek / birleşim noktası) */
  --tur-dugum-zemin: var(--ton-celik-zemin); /* düğüm dolgu */
  --tur-diger: var(--ton-celik); /* diğer (tanınmayan tür) */
  --tur-diger-zemin: var(--ton-celik-zemin); /* diğer dolgu */
  --tur-devam: var(--ton-celik); /* devam ucu (kablo başka şemaya / cihaza gidiyor) */
  --tur-devam-zemin: var(--ton-celik-zemin); /* devam ucu dolgu */
}


/* ==========================================================================
   2. KOYU TEMA — varsayılan (atölye, kanal, loş ortam)
   ========================================================================== */
:root,
:root[data-tema="koyu"] {
  color-scheme: dark;

  --zemin: #0E1216; /* sayfa zemini */
  --yuzey: #161B21; /* kart, panel, diyagram zemini */
  --yuzey-ust: #1F262E; /* girdi alanı, çip, etiket zemini */
  --yuzey-basili: #28323D; /* basılı satır / yüzey */
  --yazi: #F3F5F7; /* ana metin */
  --yazi-2: #CDD4DB; /* ikincil metin */
  --yazi-pasif: #A3ADB8; /* ipucu, yer tutucu, devre dışı */
  --cizgi: #8791A0; /* çerçeve, ayırıcı, tablo çizgisi */
  --cizgi-guclu: #AEB9C5; /* diyagram çizgisi, kablo, kablo şeridi kenarı */

  --yazi-vurgu: #8CC4FF; /* bağlantı ve vurgulu metin */
  --secili-zemin: #19304B; /* seçili satır dolgusu */
  --odak: #FFD84D; /* odak halkası */
  --golge-kaplama: 0 8px 24px rgba(0, 0, 0, 0.6); /* yalnız açılır katman (menü, alt sayfa) */

  --supheli-zemin: #FFB020; /* ŞÜPHELİ dolgusu (düz kehribar) */
  --supheli-yazi: #1A1100; /* ŞÜPHELİ yazısı ve simgesi */

  --dogrulanmadi-zemin: #2A1D47; /* DOĞRULANMADI dolgusu */
  --dogrulanmadi-yazi: #E9DEFF; /* DOĞRULANMADI yazısı */
  --dogrulanmadi-cizgi: #B999F5; /* DOĞRULANMADI çerçevesi */
  --dogrulandi-zemin: #0F3321; /* DOĞRULANDI dolgusu */
  --dogrulandi-yazi: #C4F5D6; /* DOĞRULANDI yazısı */
  --dogrulandi-cizgi: #4CD27A; /* DOĞRULANDI çerçevesi */
  --not-zemin: #1C2A3B; /* ŞEMA NOTU dolgusu */
  --not-yazi: #D3E1F2; /* ŞEMA NOTU yazısı */
  --not-cizgi: #9DB4D0; /* ŞEMA NOTU çerçevesi */

  --ton-mavi: #6FA8F0; /* beyin tonu */
  --ton-mavi-zemin: #263446; /* beyin dolgusu */
  --ton-turkuaz: #4FC4B5; /* sensör tonu */
  --ton-turkuaz-zemin: #20393C; /* sensör dolgusu */
  --ton-celik: #A7B3C0; /* soket, düğüm, direnç, diyot, diğer tonu */
  --ton-celik-zemin: #30363E; /* çelik dolgusu */
  --ton-gul: #F08BB0; /* artı besleme, güç tonu */
  --ton-gul-zemin: #3D2F3B; /* gül dolgusu */
  --ton-turuncu: #F0905A; /* şalter, röle, sigorta tonu */
  --ton-turuncu-zemin: #3D302B; /* turuncu dolgusu */
  --ton-zeytin: #A9C45A; /* motor, valf tonu */
  --ton-zeytin-zemin: #30392B; /* zeytin dolgusu */
  --ton-sari: #E8C84A; /* lamba, ikaz tonu */
  --ton-sari-zemin: #3C3A28; /* sarı dolgusu */
  --ton-kahve: #C49A6C; /* toprak tonu */
  --ton-kahve-zemin: #35322F; /* kahve dolgusu */
}

/* ---- src/diyagram/diyagram.css ---- */
/* ==========================================================================
   diyagram.css — SVG çizim motorunun biçimleri.
   Renk, boyut, yazı tipi YALNIZ src/tokens.css değişkenlerinden (DESIGN.md). Yerleşim ölçüleri (px) JS'tedir.
   ========================================================================== */

/* ---- sprite + tür işareti (DESIGN §6; test/referans.html'deki kurallarla aynı, ata-bağımsız seçiciler) ---- */
.dy-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
svg.ik { width: var(--simge); height: var(--simge); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.ik-k { width: var(--simge-kucuk); height: var(--simge-kucuk); }
.tc { fill: var(--t-zemin); stroke: var(--t-cizgi); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: var(--t-kesik, none); }
.tg { fill: none; stroke: var(--yazi); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tf, .tn { fill: var(--yazi); stroke: none; }
svg.tm { width: var(--tur-boyut); height: var(--tur-boyut); flex: none; display: block; }
svg.tm-b { width: 56px; height: 56px; }
.t-beyin { --t-cizgi: var(--tur-beyin); --t-zemin: var(--tur-beyin-zemin); }
.t-soket { --t-cizgi: var(--tur-soket); --t-zemin: var(--tur-soket-zemin); }
.t-besleme { --t-cizgi: var(--tur-besleme); --t-zemin: var(--tur-besleme-zemin); }
.t-guc { --t-cizgi: var(--tur-guc); --t-zemin: var(--tur-guc-zemin); }
.t-salter { --t-cizgi: var(--tur-salter); --t-zemin: var(--tur-salter-zemin); }
.t-role { --t-cizgi: var(--tur-role); --t-zemin: var(--tur-role-zemin); }
.t-sigorta { --t-cizgi: var(--tur-sigorta); --t-zemin: var(--tur-sigorta-zemin); }
.t-toprak { --t-cizgi: var(--tur-toprak); --t-zemin: var(--tur-toprak-zemin); }
.t-motor { --t-cizgi: var(--tur-motor); --t-zemin: var(--tur-motor-zemin); }
.t-valf { --t-cizgi: var(--tur-valf); --t-zemin: var(--tur-valf-zemin); }
.t-lamba { --t-cizgi: var(--tur-lamba); --t-zemin: var(--tur-lamba-zemin); }
.t-ikaz { --t-cizgi: var(--tur-ikaz); --t-zemin: var(--tur-ikaz-zemin); }
.t-sensor { --t-cizgi: var(--tur-sensor); --t-zemin: var(--tur-sensor-zemin); }

/* ---- cihaz sorgusu bandı ---- */

        if ((s2 >> 1) === (s1 >> 1)) return;
        var p1 = p(s1), p2 = p(s2);
        if (!p1.grup || p1.grup !== p2.grup) return;
        if (eslesir(u(s1), p2) && eslesir(u(s2), p1)) aday[s1].push(s2);
      });
    });
    devamlar.forEach(function (s1) {
      var a = aday[s1];
      if (a.length === 1 && aday[a[0]].length === 1 && aday[a[0]][0] === s1) {
        if (s1 < a[0]) uf.birlestir(s1, a[0]);
        cozuldu[s1] = true; cozuldu[a[0]] = true;
      } else if (a.length >= 1 && !cozuldu[s1]) {
        // tek taraflı ya da birden çok aday: bağlanmaz
        var tumu = a.slice();
        if (a.length > 1 || aday[a[0]].length !== 1) {
          belirsizSlot[s1] = true;
          belirsizDevam.push({ slot: s1, adaylar: tumu.map(function (x) { return p(x).uid; }) });
        }
      }
    });

    // 2b) tek başına cihaz gösteren devam ucu → aynı numaralı parçanın o cihazdaki tek ucu
    devamlar.forEach(function (s1) {
      if (cozuldu[s1] || belirsizSlot[s1]) return;
      var u1 = u(s1), p1 = p(s1);
      if (!u1.cihazN || !p1.grup) return;
      var adaylar = [];
      for (var s2 = 0; s2 < S; s2++) {
        if ((s2 >> 1) === (s1 >> 1)) continue;
        var v = u(s2);
        if (p(s2).grup === p1.grup && v.tur === 'cihaz' && v.cihazN === u1.cihazN) adaylar.push(s2);
      }
      if (!adaylar.length) return;
      var siniflar = tekil(adaylar.map(function (x) { return uf.bul(x); }));
      if (siniflar.length === 1) {
        if (uf.bul(s1 ^ 1) !== uf.bul(adaylar[0])) { uf.birlestir(s1, adaylar[0]); cozuldu[s1] = true; }
      } else {
        belirsizSlot[s1] = true;
        belirsizDevam.push({ slot: s1, adaylar: adaylar.map(function (x) { return p(x).uid; }) });
      }
    });

    return { uf: uf, S: S, belirsizDevam: belirsizDevam };
  }

  // ---- 3. graf: eklemleri çökert, paralel kenarları birleştir ------------------------------------------------
  function grafKur(parcalar, bag) {
    var uf = bag.uf, S = bag.S, n = parcalar.length;
    var kok = [];
    for (var s = 0; s < S; s++) kok[s] = uf.bul(s);
    function devamMi(x) { return parcalar[x >> 1].uclar[x & 1].tur === 'devam'; }

    var sinifSlot = {};
    for (s = 0; s < S; s++) (sinifSlot[kok[s]] = sinifSlot[kok[s]] || []).push(s);

    // eklem: yalnız devam uçlarından oluşan, iki farklı parçayı bağlayan sınıf
    var eklem = {};
    Object.keys(sinifSlot).forEach(function (r) {
      var sl = sinifSlot[r];
      if (sl.length === 2 && devamMi(sl[0]) && devamMi(sl[1]) && (sl[0] >> 1) !== (sl[1] >> 1)) eklem[r] = true;
    });

    // eklemlerle uç uca gelen parçalar tek tel (tek kenar) olur
    var pu = yeniUF(n);
    Object.keys(eklem).forEach(function (r) { pu.birlestir(sinifSlot[r][0] >> 1, sinifSlot[r][1] >> 1); });
    var teller = {}, telSirasi = [];
    for (var k = 0; k < n; k++) {
      var r0 = pu.bul(k);
      if (!teller[r0]) { teller[r0] = []; telSirasi.push(r0); }
      teller[r0].push(k);
    }
    var kenarlar = [];
    function tekKenar(uyeler, serbestA, serbestB) {
      kenarlar.push({ ka: kok[serbestA], kb: kok[serbestB], parcalar: uyeler.map(function (x) { return parcalar[x]; }) });
    }
    telSirasi.forEach(function (r0) {
      var uyeler = teller[r0];
      if (uyeler.length === 1) { tekKenar(uyeler, 2 * uyeler[0], 2 * uyeler[0] + 1); return; }
      var serbest = [];
      uyeler.forEach(function (x) {
        [2 * x, 2 * x + 1].forEach(function (sl) { if (!eklem[kok[sl]]) serbest.push(sl); });
      });
      if (serbest.length === 2) { tekKenar(uyeler, serbest[0], serbest[1]); return; }
      // beklenmeyen (halka ya da dallanan eklem): çökertme, her parça ayrı kenar; eklemler düğüm olarak kalır
      uyeler.forEach(function (x) {
        [2 * x, 2 * x + 1].forEach(function (sl) { delete eklem[kok[sl]]; });
        tekKenar([x], 2 * x, 2 * x + 1);
      });
    });

    // paralel (aynı iki düğüm, aynı grup) kenarlar tek kenarda birleşir
    var gorulen = {}, birlesik = [];
    kenarlar.forEach(function (e) {
      var a = Math.min(e.ka, e.kb), b = Math.max(e.ka, e.kb);
      var grup = e.parcalar[0].grup || ('~' + e.parcalar[0].uid);
      var anahtar = a + '-' + b + '|' + grup;
      if (gorulen[anahtar] !== undefined) {
        var hedef = birlesik[gorulen[anahtar]];
        e.parcalar.forEach(function (q) { hedef.parcalar.push(q); });
      } else {
        gorulen[anahtar] = birlesik.length;
        birlesik.push(e);
      }
    });

    // düğümler: kenar uçlarındaki sınıflar, ilk görünme sırasıyla
    var dugumler = [], sinifDugum = {};
    function dugumDe(r) {
      if (sinifDugum[r] === undefined) {
        sinifDugum[r] = dugumler.length;
        dugumler.push({ kok: r, slotlar: sinifSlot[r].slice() });
      }
      return sinifDugum[r];
    }
    var son = birlesik.map(function (e) {
      return { a: dugumDe(e.ka), b: dugumDe(e.kb), parcalar: e.parcalar.sort(function (x, y) { return x.sira - y.sira; }) };
    });
    return { dugumler: dugumler, kenarlar: son, sinifSlot: sinifSlot };
  }

  // ---- 4. düğüm ve kenar nesneleri -------------------------------------------------------------------------------
  function cihazAdi(d) { return d.kisaAd ? d.kisaAd + ' (' + d.cihaz + ')' : d.cihaz; }

  function dugumAdi(d) {
    if (d.tur === 'cihaz') return cihazAdi(d);
    if (d.tur === 'soket') return d.soket;
    if (d.tur === 'dugum') return d.kodsuz ? 'ek noktası (kodsuz' + (d.kodsuzNo ? ' #' + d.kodsuzNo : '') + ')' : 'ek noktası ' + d.kod;
    var hedef = d.hedefCihaz
      ? (d.hedefCihazAd ? d.hedefCihazAd + ' (' + d.hedefCihaz + ')' : d.hedefCihaz)
      : (d.sayfaIci ? 'yol ' + d.hedef : 'sayfa/yol ' + d.hedef);
    return 'devam → ' + hedef;
  }

  function dugumNesnesi(db, nd, parcalar, kesikUclar) {
    var slotlar = nd.slotlar;
    var uclar = slotlar.map(function (s) { return parcalar[s >> 1].uclar[s & 1]; });
    var gercekTum = uclar.filter(function (u) { return u.tur !== 'devam'; });
    // sanal parçanın ucu yalnız başka uç yoksa kaynak olur (alanlar gerçek uçlardan gelir)
    var gercek = gercekTum.filter(function (u) { return !u.sanalUc; });
    if (!gercek.length) gercek = gercekTum;
    var d = { id: null, tur: gercek.length ? gercek[0].tur : 'devam', ad: null };
    var kayit;
    if (d.tur === 'cihaz') {
      var kod = gercek[0].cihaz;
      kayit = db._cihaz[gercek[0].cihazN];
      d.cihaz = kayit ? kayit.kod : kod;
      d.cihazTur = kayit ? kayit.cihazTur : ic().turdenKod(kod);
      d.kisaAd = kayit ? kayit.kisaAd : null;
      d.adTr = kayit ? kayit.adTr : null;
      d.adDe = kayit ? kayit.adDe : null;
      d.cihazBilinmiyor = kayit ? kayit.cihazBilinmiyor : true;
      d.soket = ilkDolu(gercek.map(function (u) { return u.soket; }));
      d.pin = ilkDolu(gercek.map(function (u) { return u.pin; }));
      d.pinAdi = ilkDolu(gercek.map(function (u) { return u.pinAdi; }));
      d.adresEksik = d.pin == null;
      d.gecisUcu = uclar.some(function (u) { return u.sanalUc === true; });   // bir geçiş bileşeninin (sigorta/diyot/direnç/şalter) ucu
    } else if (d.tur === 'soket') {
      d.soket = gercek[0].soket;
      d.pin = ilkDolu(gercek.map(function (u) { return u.pin; }));
    } else if (d.tur === 'dugum') {
      d.kod = gercek[0].kod;
      d.kodsuz = d.kod.charAt(0) === '~';
    } else {
      d.hedefCihaz = ilkDolu(uclar.map(function (u) { return u.cihaz; }));
      d.hedefCihazAd = null;
      if (d.hedefCihaz) {
        var h = db._cihaz[norm(d.hedefCihaz)];
        if (h) { d.hedefCihaz = h.kod; d.hedefCihazAd = h.kisaAd; }
      }
      d.hedef = ilkDolu(uclar.map(function (u) { return u.hedef; }));
      d.sayfaIci = !d.hedefCihaz && uclar.some(function (u) { return u.yolNo != null; });   // hedef yalnız yol numarası ("74"): aynı sayfada devam ediyor
      d.cozuldu = slotlar.length >= 2;
    }
    d.belirsiz = uclar.some(function (u) { return u.belirsiz === true; });
    d.derece = 0; d.yaprak = false; d.dal = false; d.acik = false;
    d.kesik = slotlar.some(function (s) { return kesikUclar[parcalar[s >> 1].uid + '#' + (s & 1)] === true; });
    d.celiski = false;
    d.digerKablolar = [];
    d.kenarlar = [];
    d.kendineDonen = [];
    var kaynakSlotlari = slotlar.filter(function (s) { return !parcalar[s >> 1].sanal; });
    if (!kaynakSlotlari.length) kaynakSlotlari = slotlar;   // yalnız sanal uç kaldıysa (sınır): sanal parçanın kendi yeri
    d.kaynaklar = ic().kaynakTekil(db, kaynakSlotlari.map(function (s) { return ic().kaynak(db, parcalar[s >> 1]); }));
    d.ham = tekil(uclar.map(function (u) { return u.ham; }));
    // sıralama anahtarı (çıktıya girmez)
    nd.vkey = gercek.length ? gercek[0].vkey : null;
    nd.beyin = d.tur === 'cihaz' && d.cihazTur === 'beyin';
    nd.anahtar = d.tur === 'cihaz' ? 'C ' + d.cihaz + ' ' + (d.soket || '') + ' ' + (d.pin || '')
      : d.tur === 'soket' ? 'S ' + d.soket + ' ' + (d.pin || '')
      : d.tur === 'dugum' ? 'D ' + d.kod
      : 'V ' + (d.hedefCihaz || '') + ' ' + (d.hedef || '');
    nd.tur = d.tur;
    return d;
  }

  var DURUM_SIRASI = { eslesti: 0, cozuldu: 1, suphe: 2 };

  /** Geçiş bileşeninin sanal kenarı: kablo değildir; yer bilgisi bileşen listesindeki yoldur (API.md §4.9). */
  function sanalKenarNesnesi(db, p, baglam) {
    var r = db._cihaz[norm(p.bilesen.kod)];
    var kaynaklar = r ? ic().cihazKaynaklari(db, r).filter(function (k) { return baglam.izSemalar[k.sema] === true; }) : [];
    if (!kaynaklar.length) {
      // bileşen listesinde yeri yok: uçlarındaki (ize girmiş) gerçek parçaların yeri
      p.uclar.forEach(function (u) {
        u.gercek.forEach(function (x) { if (baglam.dahilUid[x.p.uid] === true) kaynaklar.push(ic().kaynak(db, x.p)); });
      });
    }
    if (!kaynaklar.length) kaynaklar.push(ic().kaynak(db, p));
    kaynaklar = ic().kaynakTekil(db, kaynaklar);
    var dg = ic().dogrulandiMi(db, tekil(kaynaklar.map(function (k) { return k.sema; })));
    return {
      id: null, a: null, b: null,
      etiket: null, etiketler: [], no: null, isaret: null,
      renk: null, renkAd: null, renkParcalari: [], renkSemaNotu: false,
      kesit: null, kesitMetni: null, kesitSemaNotu: false,
      varyant: false, durum: 'eslesti', suphe: null, supheli: false, not: null,
      kaynak: kaynaklar[0], kaynaklar: kaynaklar, parcalar: [p.uid],
      dogrulandi: dg.dogrulandi, celiski: false, beyinListesi: [], geri: false,
      sanal: true,
      bilesen: {
        kod: p.bilesen.kod, tur: p.bilesen.tur, turAd: p.bilesen.turAd, ad: p.bilesen.ad,
        kisaAd: p.bilesen.kisaAd, adTr: p.bilesen.adTr, adDe: p.bilesen.adDe, cihazBilinmiyor: p.bilesen.cihazBilinmiyor
      },
      ic: false, kendineDonen: false, soketIci: false
    };
  }

  function kenarNesnesi(db, ed, uyarilar, baglam) {
    var ps = ed.parcalar;
    if (ps.length === 1 && ps[0].sanal) return sanalKenarNesnesi(db, ps[0], baglam);
    var R = mod('renkler');
    var ef = ps.map(function (p) { return R.etkin(p, db.semalar[p.sema] ? db.semalar[p.sema].varsayilan : null); });
    function sec(alan, notAlani) {
      for (var i = 0; i < ef.length; i++) if (ef[i][alan] != null && !ef[i][notAlani]) return ef[i];
      for (i = 0; i < ef.length; i++) if (ef[i][alan] != null) return ef[i];
      return ef[0];
    }
    var rs = sec('renk', 'renkSemaNotu'), ks = sec('kesit', 'kesitSemaNotu');
    var etiketler = tekil(ps.map(function (p) { return p.etiket; }));
    var kaynaklar = ic().kaynakTekil(db, ps.map(function (p) { return ic().kaynak(db, p); }));
    var durum = 'eslesti';
    ps.forEach(function (p) { if ((DURUM_SIRASI[p.durum] || 0) > DURUM_SIRASI[durum]) durum = p.durum; });
    var suphe = null;
    ps.forEach(function (p) { if (!suphe && p.suphe) suphe = p.suphe; });
    var notlar = tekil(ps.map(function (p) { return p.not; }));
    var semalar = tekil(ps.map(function (p) { return p.sema; }));
    var bl = [];
    ps.forEach(function (p) { p.bl.forEach(function (c) { bl.push({ alan: c.alan, sema: c.sema, beyinListesi: c.beyinListesi, not: c.not == null ? null : c.not, parca: p.uid }); }); });
    // aynı iletkenin farklı yerlerde çeliştirilen değerleri
    var ozelRenk = tekil(ps.map(function (p) { return p.renk; })), ozelKesit = tekil(ps.map(function (p) { return p.kesit; }));
    var yer = etiketler[0] ? 'Kablo ' + etiketler[0] : 'Etiketsiz kablo';
    if (ozelRenk.length > 1) uyarilar.push({ tur: 'ozellik', onem: 'uyari', mesaj: yer + ': renk iki yerde farklı yazılmış (' + ozelRenk.join(' / ') + ').', kenar: null, _ed: ed });
    if (ozelKesit.length > 1) uyarilar.push({ tur: 'ozellik', onem: 'uyari', mesaj: yer + ': kesit iki yerde farklı yazılmış (' + ozelKesit.join(' / ') + ').', kenar: null, _ed: ed });
    var varyantlar = tekil(ps.map(function (p) { return p.varyant; }));
    if (varyantlar.length > 1) uyarilar.push({ tur: 'varyant', onem: 'uyari', mesaj: yer + ': aynı iletken bir yerde kesikli (varyant), başka yerde düz çizilmiş.', kenar: null, _ed: ed });
    ps.forEach(function (p) {
      p.bl.forEach(function (c) {
        uyarilar.push({
          tur: 'beyin-listesi', onem: 'uyari', kenar: null, _ed: ed,
          mesaj: "Beyin Listesi'nde " + c.alan + ' "' + c.beyinListesi + '", şemada "' + c.sema + '" (şema esas alındı).' + (c.not ? ' ' + c.not : '')
        });
      });
    });
    var dg = ic().dogrulandiMi(db, semalar);
    var icKenar = ps.some(function (p) { return p.ic; });   // cihaz içi köprü: kablo değil, renk/kesit (şema notu dahil) yok
    // iki ucu da aynı cihazın AYNI soketinde (farklı pinler): numaralı, aranabilir bir kablodur (ic değil); yalnız "aynı soket içinde köprü" diye işaretlenir
    var soketIci = !icKenar && ps.every(function (p) {
      var a = p.uclar[0], b = p.uclar[1];
      return !p.kendineDonen && a.tur === 'cihaz' && b.tur === 'cihaz' && a.cihazN === b.cihazN &&
        a.soket != null && b.soket != null && norm(a.soket) === norm(b.soket);
    });
    return {
      id: null, a: null, b: null,
      etiket: etiketler[0] || null, etiketler: etiketler, no: ilkDolu(ps.map(function (p) { return p.no; })),
      isaret: ps.some(function (p) { return p.isaret; }) ? ilkDolu(ps.map(function (p) { return p.isaret; })) : null,
      renk: icKenar ? null : rs.renk, renkAd: icKenar ? null : rs.renkAd, renkParcalari: icKenar ? [] : rs.renkParcalari, renkSemaNotu: icKenar ? false : rs.renkSemaNotu,
      kesit: icKenar ? null : ks.kesit, kesitMetni: icKenar ? null : ks.kesitMetni, kesitSemaNotu: icKenar ? false : ks.kesitSemaNotu,
      varyant: ps.some(function (p) { return p.varyant; }),
      durum: durum, suphe: suphe,
      supheli: ps.some(function (p) { return p.durum === 'suphe' || belirsiz(p.etiket) || belirsiz(p.no); }),
      not: notlar.length ? notlar.join(' / ') : null,
      kaynak: kaynaklar[0], kaynaklar: kaynaklar, parcalar: ps.map(function (p) { return p.uid; }),
      dogrulandi: dg.dogrulandi, celiski: false, beyinListesi: bl, geri: false,
      sanal: false, bilesen: null, ic: icKenar, kendineDonen: false, soketIci: soketIci
    };
  }

  // ---- 5. bileşenler: kök, ağaç, zincir, yıldız --------------------------------------------------------------------
  // Zincirin hangi uçtan başlayacağı: gerçek uçlar önce (devam yaprağı sona), beyin olmayan önce (kaynak → beyin),
  // sonra cihaz < ara soket < ek noktası, eşitlikte doğal sıra.
  function yaprakSirasi(nodes, x, y) {
    var a = nodes[x], b = nodes[y];
    var da = a.tur === 'devam', db = b.tur === 'devam';
    if (da !== db) return da ? 1 : -1;
    if (a.beyin !== b.beyin) return a.beyin ? 1 : -1;
    var ta = { cihaz: 0, soket: 1, dugum: 2, devam: 3 }[a.tur], tb = { cihaz: 0, soket: 1, dugum: 2, devam: 3 }[b.tur];
    if (ta !== tb) return ta - tb;
    return dogal(a.anahtar, b.anahtar) || (x - y);
  }

  function bilesenleriBul(N, adj) {
    var gorulen = [], bilesenler = [];
    for (var i = 0; i < N; i++) {
      if (gorulen[i]) continue;
      var uyeler = [], kuyruk = [i];
      gorulen[i] = true;
      for (var h = 0; h < kuyruk.length; h++) {
        var x = kuyruk[h];
        uyeler.push(x);
        adj[x].forEach(function (k) { if (!gorulen[k.diger]) { gorulen[k.diger] = true; kuyruk.push(k.diger); } });
      }
      uyeler.sort(function (p, q) { return p - q; });
      bilesenler.push(uyeler);
    }
    return bilesenler;
  }

  /** Kökten derinlik öncelikli ağaç (kararlı komşu sırası), çocuklar en küçük yaprak anahtarına göre sıralanır. */
  function agacKur(kokIdx, adj, nodes) {
    var ziyaret = {}, kullanildi = {}, geri = [], yon = {};
    function git(u, ustKenar) {
      var d = { dugum: u, kenar: ustKenar, cocuklar: [] };
      ziyaret[u] = true;
      var komsular = adj[u].slice().sort(function (x, y) {
        return dogal(nodes[x.diger].anahtar, nodes[y.diger].anahtar) || (x.kenar - y.kenar);
      });
      komsular.forEach(function (k) {
        if (kullanildi[k.kenar]) return;
        kullanildi[k.kenar] = true;
        if (ziyaret[k.diger]) { geri.push({ kenar: k.kenar, a: u, b: k.diger }); return; }
        yon[k.kenar] = [u, k.diger];
        d.cocuklar.push(git(k.diger, k.kenar));
      });
      return d;
    }
    var kokAgac = git(kokIdx, null);
    function minYaprak(d) {
      if (!d.cocuklar.length) return nodes[d.dugum].anahtar;
      var en = null;
      d.cocuklar.forEach(function (c) { var m = minYaprak(c); if (en === null || dogal(m, en) < 0) en = m; });
      return en;
    }
    function sirala(d) {
      d.cocuklar.forEach(sirala);
      var anahtarlar = d.cocuklar.map(function (c) { return { c: c, m: minYaprak(c) }; });
      anahtarlar.sort(function (x, y) { return dogal(x.m, y.m) || (x.c.kenar - y.c.kenar); });
      d.cocuklar = anahtarlar.map(function (x) { return x.c; });
    }
    sirala(kokAgac);
    return { agac: kokAgac, geri: geri, yon: yon };
  }

  function onSira(agac, dugumler, kenarlar) {
    dugumler.push(agac.dugum);
    if (agac.kenar !== null) kenarlar.push(agac.kenar);
    agac.cocuklar.forEach(function (c) { onSira(c, dugumler, kenarlar); });
  }

  function bilesenKur(uyeler, adj, derece, nodes, odakIdx, baslangicIdx) {
    var uyeKume = kume(uyeler.map(String));
    var icinde = function (x) { return x != null && uyeKume[String(x)] === true; };
    var dal = uyeler.some(function (x) { return derece[x] >= 3; });

    // kök
    var kokIdx;
    if (icinde(baslangicIdx)) kokIdx = baslangicIdx;
    else if (icinde(odakIdx)) kokIdx = odakIdx;
    else {
      var yapraklar = uyeler.filter(function (x) { return derece[x] === 1; });
      var adaylar = (yapraklar.length ? yapraklar : uyeler).slice().sort(function (x, y) { return yaprakSirasi(nodes, x, y); });
      kokIdx = adaylar[0];
    }

    var t = agacKur(kokIdx, adj, nodes);
    var dongu = t.geri.length > 0;
    var b = { kok: kokIdx, odak: icinde(odakIdx) ? odakIdx : null, uyeler: uyeler, agac: t.agac, geri: t.geri, yon: t.yon, dal: dal, dongu: dongu };

    // zincir (dal ve çevrim yoksa)
    b.zincir = null; b.zincirKenarlari = null;
    if (!dal && !dongu) {
      var uclar = uyeler.filter(function (x) { return derece[x] === 1; });
      if (uyeler.length === 1) {
        b.zincir = [uyeler[0]]; b.zincirKenarlari = [];   // tek düğüm (yalnız kendine dönen kenarı olan uç)
      } else if (uclar.length === 2) {
        var bas = uclar.indexOf(kokIdx) >= 0 ? kokIdx : uclar.slice().sort(function (x, y) { return yaprakSirasi(nodes, x, y); })[0];
        var zincir = [bas], kenarlar = [], onceki = -1, simdi = bas;
        for (;;) {
          var sonraki = null;
          for (var i = 0; i < adj[simdi].length; i++) {
            if (adj[simdi][i].kenar !== onceki) { sonraki = adj[simdi][i]; break; }
          }
          if (!sonraki) break;
          kenarlar.push(sonraki.kenar);
          zincir.push(sonraki.diger);
          onceki = sonraki.kenar; simdi = sonraki.diger;
          if (derece[simdi] === 1) break;
        }
        b.zincir = zincir; b.zincirKenarlari = kenarlar;
      }
    }

    // yıldız: tek dallanma düğümü, çevrim yok
    b.merkez = null; b.yildiz = null;
    if (dal) {
      var dalliler = uyeler.filter(function (x) { return derece[x] >= 3; });
      dalliler.sort(function (x, y) { return (derece[y] - derece[x]) || dogal(nodes[x].anahtar, nodes[y].anahtar); });
      b.merkez = dalliler[0];
      if (dalliler.length === 1 && !dongu) {
        var kollar = adj[b.merkez].map(function (k) {
          var dugumler = [], kenarlar2 = [], kenar = k.kenar, simdi2 = k.diger;
          for (;;) {
            dugumler.push(simdi2); kenarlar2.push(kenar);
            if (derece[simdi2] !== 2) break;
            var sn = adj[simdi2].filter(function (x) { return x.kenar !== kenar; })[0];
            kenar = sn.kenar; simdi2 = sn.diger;
          }
          return { dugumler: dugumler, kenarlar: kenarlar2 };
        });
        kollar.sort(function (x, y) {
          return dogal(nodes[x.dugumler[x.dugumler.length - 1]].anahtar, nodes[y.dugumler[y.dugumler.length - 1]].anahtar);
        });
        b.yildiz = kollar;
      }
    }
    return b;
  }

  // ---- 6. çelişkiler ----------------------------------------------------------------------------------------
  function ilgiliCeliskiler(db, dahilUid, gruplar) {
    return db._celiskiler.filter(function (c) {
      if (c.tur === 'pin-numara') return c.parcalar.some(function (uid) { return dahilUid[uid] === true; });
      return gruplar[c.anahtar] === true;
    });
  }

  // ---- 7. asıl kurucu --------------------------------------------------------------------------------------------
  function kurIz(db, kimlik, tohumlar, odak, opts) {
    opts = opts || {};
    var maks = opts.maksKenar > 0 ? opts.maksKenar : VARSAYILAN_MAKS;
    var semaKume = opts.semalar && opts.semalar.length ? kume(opts.semalar) : null;
    if (semaKume) tohumlar = tohumlar.filter(function (p) { return semaKume[p.sema] === true; });
    if (!tohumlar.length) return null;

    var g = genislet(db, tohumlar, semaKume, maks);
    var parcalar = g.parcalar;
    var bag = baglanti(parcalar);
    var graf = grafKur(parcalar, bag);
    var uyarilar = [];

    // izde bulunan gerçek (sanal olmayan) parçalar
    var dahilUid = {}, gruplar = {}, gercekSemalar = [];
    parcalar.forEach(function (p) {
      if (p.sanal) return;
      dahilUid[p.uid] = true;
      if (p.grup) gruplar[p.grup] = true;
      if (gercekSemalar.indexOf(p.sema) < 0) gercekSemalar.push(p.sema);
    });
    var baglam = { izSemalar: kume(gercekSemalar), dahilUid: dahilUid };

    // düğüm nesneleri
    var nodes = graf.dugumler;
    var dugumNes = nodes.map(function (nd) { return dugumNesnesi(db, nd, parcalar, g.kesikUclar); });
    var kenarNes = graf.kenarlar.map(function (ed) { return kenarNesnesi(db, ed, uyarilar, baglam); });

    // komşuluk ve derece. Kendine dönen kenar (iki ucu aynı düğüm) yapıya girmez: derece, ağaç, zincir, çevrim hesabını bozmaz.
    var N = nodes.length;
    var adj = [], derece = [], dongular = [];
    for (var i = 0; i < N; i++) { adj[i] = []; derece[i] = 0; }
    graf.kenarlar.forEach(function (ed, ei) {
      if (ed.a === ed.b) { dongular.push(ei); return; }
      adj[ed.a].push({ kenar: ei, diger: ed.b }); adj[ed.b].push({ kenar: ei, diger: ed.a });
      derece[ed.a]++; derece[ed.b]++;
    });
    dugumNes.forEach(function (d, x) {
      d.derece = derece[x];
      d.yaprak = derece[x] === 1;
      d.dal = derece[x] >= 3;
      d.acik = (d.tur === 'soket' || d.tur === 'dugum') && derece[x] === 1 && !d.kesik;
    });

    // odak ve başlangıç düğümleri
    function dugumBul(ozellik) {
      if (!ozellik) return null;
      for (var x = 0; x < N; x++) {
        var nd = nodes[x], d = dugumNes[x];
        if (ozellik.vkey && nd.vkey === ozellik.vkey) return x;
        if (ozellik.slot !== undefined && nd.slotlar.indexOf(ozellik.slot) >= 0) return x;
        if (ozellik.cihazKodu && d.tur === 'cihaz' && norm(d.cihaz) === ozellik.cihazKodu) return x;
        if (ozellik.soketAdi && d.tur === 'soket' && norm(d.soket) === ozellik.soketAdi) return x;
      }
      return null;
    }
    var odakIdx = null;
    if (odak) {
      if (odak.vkey) odakIdx = dugumBul({ vkey: odak.vkey });
      else if (odak.uid) {
        var pi = -1;
        for (var q = 0; q < parcalar.length; q++) if (parcalar[q].uid === odak.uid) { pi = q; break; }
        if (pi >= 0) {
          var kokSlot = bag.uf.bul(2 * pi + odak.uc);
          for (var x2 = 0; x2 < N; x2++) if (nodes[x2].kok === kokSlot) { odakIdx = x2; break; }
        }
      }
    }
    var baslangicIdx = null;
    if (opts.baslangic) {
      var b0 = opts.baslangic;
      if (typeof b0 === 'string') baslangicIdx = dugumBul({ cihazKodu: norm(b0) }) !== null ? dugumBul({ cihazKodu: norm(b0) }) : dugumBul({ soketAdi: norm(b0) });
      else if (b0.cihaz || b0.soket) {
        var vk = b0.cihaz ? 'C|' + norm(b0.cihaz) + '|' + norm(b0.soket || '') + '|' + pinKimligi(b0.pin || '') : 'S|' + norm(b0.soket) + '|' + pinKimligi(b0.pin || '');
        baslangicIdx = dugumBul({ vkey: vk });
      }
    }

    // kodsuz ek noktalarını numarala (birden çoksa)
    var kodsuzlar = dugumNes.filter(function (d) { return d.tur === 'dugum' && d.kodsuz; });
    if (kodsuzlar.length > 1) kodsuzlar.forEach(function (d, s) { d.kodsuzNo = s + 1; });
    dugumNes.forEach(function (d) { d.ad = dugumAdi(d); });

    // bileşenler
    var uyeListeleri = bilesenleriBul(N, adj);
    var bilesenler = uyeListeleri.map(function (uyeler) {
      var bl = bilesenKur(uyeler, adj, derece, nodes, odakIdx, baslangicIdx);
      bl.kenarSayisi = graf.kenarlar.filter(function (ed) { return uyeler.indexOf(ed.a) >= 0; }).length;
      bl.kendineDonen = dongular.filter(function (ei) { return uyeler.indexOf(graf.kenarlar[ei].a) >= 0; });
      bl.ilkSlot = Math.min.apply(null, uyeler.map(function (x) { return Math.min.apply(null, nodes[x].slotlar); }));
      return bl;
    });
    bilesenler.sort(function (x, y) { return (y.kenarSayisi - x.kenarSayisi) || (x.ilkSlot - y.ilkSlot); });

    // kimlik atama: bileşen sırasıyla, ağaç ön sırasıyla
    var dugumSirasi = [], kenarSirasi = [];
    bilesenler.forEach(function (b) {
      var ds = [], ks = [];
      onSira(b.agac, ds, ks);
      b.onSiraDugum = ds;
      b.onSiraKenar = ks.concat(b.geri.map(function (x) { return x.kenar; }));
      ds.forEach(function (x) { dugumSirasi.push(x); });
      b.onSiraKenar.forEach(function (x) { kenarSirasi.push(x); });
      b.kendineDonen.forEach(function (x) { kenarSirasi.push(x); });   // kimlikleri en sonda
    });
    var dugumId = [], kenarId = [];
    dugumSirasi.forEach(function (x, s) { dugumId[x] = 'n' + (s + 1); });
    kenarSirasi.forEach(function (x, s) { kenarId[x] = 'e' + (s + 1); });

    // kenar yönleri: zincirde zincir sırası, ağaçta üstten alta, geri kenarlarda karşılaşma sırası
    var yonA = [], yonB = [];
    bilesenler.forEach(function (b) {
      if (b.zincir) {
        b.zincirKenarlari.forEach(function (ei, s) { yonA[ei] = b.zincir[s]; yonB[ei] = b.zincir[s + 1]; });
      } else {
        Object.keys(b.yon).forEach(function (ei) { yonA[ei] = b.yon[ei][0]; yonB[ei] = b.yon[ei][1]; });
      }
      b.geri.forEach(function (x) { yonA[x.kenar] = x.a; yonB[x.kenar] = x.b; });
    });

    // çelişkiler (yükleme sırasında bulunanların bu ize girenleri)
    var celiskiler = ilgiliCeliskiler(db, dahilUid, gruplar);
    celiskiler.forEach(function (c) {
      var uyari = { tur: 'celiski', onem: c.onem || 'hata', mesaj: c.mesaj, dugum: null, kenar: null };
      if (c.tur === 'pin-numara') {
        nodes.forEach(function (nd, x) { if (nd.vkey === c.vkey) { dugumNes[x].celiski = true; uyari._dugumIdx = x; } });
        graf.kenarlar.forEach(function (ed, ei) {
          if (ed.parcalar.some(function (p) { return c.parcalar.indexOf(p.uid) >= 0; })) kenarNes[ei].celiski = true;
        });
      } else {
        var kodN = c.cihaz ? norm(c.cihaz) : null, soketN = c.soket ? norm(c.soket) : null;
        nodes.forEach(function (nd, x) {
          var d = dugumNes[x];
          var dugumEslesir = (kodN && d.tur === 'cihaz' && norm(d.cihaz) === kodN) || (soketN && d.tur === 'soket' && norm(d.soket) === soketN);
          if (!dugumEslesir) return;
          var grupKenari = adj[x].some(function (k) { return graf.kenarlar[k.kenar].parcalar.some(function (p) { return p.grup === c.anahtar; }); });
          if (grupKenari) {
            d.celiski = true; if (uyari._dugumIdx === undefined) uyari._dugumIdx = x;
            adj[x].forEach(function (k) {
              if (graf.kenarlar[k.kenar].parcalar.some(function (p) { return p.grup === c.anahtar; })) kenarNes[k.kenar].celiski = true;
            });
          }
        });
      }
      uyarilar.push(uyari);
    });

    // diğer kablolar: cihaz pininde olup ize girmeyenler
    nodes.forEach(function (nd, x) {
      if (dugumNes[x].tur !== 'cihaz' || !nd.vkey) return;
      var goruldu = {};
      (db._vertex[nd.vkey] || []).forEach(function (r) {
        if (dahilUid[r.p.uid] === true || (semaKume && semaKume[r.p.sema] !== true) || goruldu[r.p.uid]) return;
        goruldu[r.p.uid] = true;
        dugumNes[x].digerKablolar.push({ etiket: r.p.etiket, sema: r.p.sema, parca: r.p.id });
      });
    });

    // uyarılar: devam, çevrim, sınır, açık uç
    bag.belirsizDevam.forEach(function (b) {
      var d = null;
      nodes.forEach(function (nd, x) { if (nd.slotlar.indexOf(b.slot) >= 0) d = x; });
      uyarilar.push({
        tur: 'belirsiz-devam', onem: 'uyari', kenar: null, _dugumIdx: d,
        mesaj: (d !== null ? dugumNes[d].ad : 'devam oku') + ' birden çok yere uyuyor, bağlanmadı (' + b.adaylar.join(', ') + ').'
      });
    });
    bilesenler.forEach(function (b, bi) {
      if (b.dongu) {
        uyarilar.push({ tur: 'cevrim', onem: 'uyari', kenar: null, dugum: null, mesaj: 'Kablo ' + (bilesenler.length > 1 ? 'parçası ' + (bi + 1) + ' ' : '') + 'bir çevrim oluşturuyor (' + b.geri.length + ' kenar çevrimi kapatıyor).' });
      }
    });
    if (g.sinirAsildi) {
      uyarilar.push({ tur: 'sinir', onem: 'uyari', kenar: null, dugum: null, mesaj: 'İz çok uzun: ' + maks + ' kablo parçasından sonra kesildi.' });
    }
    dugumNes.forEach(function (d, x) {
      if (d.acik) {
        uyarilar.push({
          tur: 'acik-uc', onem: 'bilgi', kenar: null, _dugumIdx: x,
          mesaj: d.tur === 'soket' ? d.ad + ' pin ' + d.pin + ': öbür tarafı şemada yok.' : d.ad + ': tek parça bağlı, öbür tarafı şemada yok.'
        });
      }
    });

    // son nesneler
    nodes.forEach(function (nd, x) { dugumNes[x].id = dugumId[x]; });
    graf.kenarlar.forEach(function (ed, ei) {
      var k = kenarNes[ei];
      k.id = kenarId[ei];
      k.a = dugumId[yonA[ei] !== undefined ? yonA[ei] : ed.a];
      k.b = dugumId[yonB[ei] !== undefined ? yonB[ei] : ed.b];
      // kendine dönen kenar (iki ucu da aynı düğüm) yalnız kendineDonen'e girer; kenarlar listesi ve derece onu saymaz (API.md §4.4)
      if (ed.b !== ed.a) { dugumNes[ed.a].kenarlar.push(k.id); dugumNes[ed.b].kenarlar.push(k.id); }
      else { k.kendineDonen = true; dugumNes[ed.a].kendineDonen.push(k.id); }
    });
    dugumNes.forEach(function (d) {
      d.kenarlar.sort(function (a, b) { return dogal(a, b); });
      d.kendineDonen.sort(function (a, b) { return dogal(a, b); });
    });
    bilesenler.forEach(function (b) {
      b.geri.forEach(function (x) { kenarNes[x.kenar].geri = true; });
    });
    // uyarıların iç başvurularını (_dugumIdx, _ed) kimliğe çevir
    uyarilar.forEach(function (u) {
      u.dugum = u._dugumIdx !== undefined && u._dugumIdx !== null ? dugumId[u._dugumIdx] : null;
      var ei = u._ed ? graf.kenarlar.indexOf(u._ed) : -1;
      u.kenar = ei >= 0 ? kenarId[ei] : null;
      delete u._dugumIdx;
      delete u._ed;
    });
    var onemSirasi = { hata: 0, uyari: 1, bilgi: 2 };
    uyarilar = uyarilar.map(function (u, s) { return { u: u, s: s }; })
      .sort(function (x, y) { return (onemSirasi[x.u.onem] - onemSirasi[y.u.onem]) || (x.s - y.s); })
      .map(function (x) { return x.u; });

    function agacNesne(a) {
      return { dugum: dugumId[a.dugum], kenar: a.kenar === null ? null : kenarId[a.kenar], cocuklar: a.cocuklar.map(agacNesne) };
    }
    var bilesenNes = bilesenler.map(function (b, bi) {
      return {
        id: 'b' + (bi + 1),
        baslangic: dugumId[b.kok],
        odak: b.odak === null ? null : dugumId[b.odak],
        dugumler: b.onSiraDugum.map(function (x) { return dugumId[x]; }),
        kenarlar: b.onSiraKenar.map(function (x) { return kenarId[x]; }),
        zincir: b.zincir ? b.zincir.map(function (x) { return dugumId[x]; }) : null,
        zincirKenarlar: b.zincirKenarlari ? b.zincirKenarlari.map(function (x) { return kenarId[x]; }) : null,
        agac: agacNesne(b.agac),
        yildiz: b.yildiz ? {
          merkez: dugumId[b.merkez],
          kollar: b.yildiz.map(function (k) {
            return { dugumler: k.dugumler.map(function (x) { return dugumId[x]; }), kenarlar: k.kenarlar.map(function (x) { return kenarId[x]; }) };
          })
        } : null,
        geriKenarlar: b.geri.map(function (x) { return kenarId[x.kenar]; }),
        kendineDonenKenarlar: b.kendineDonen.map(function (x) { return kenarId[x]; }),
        dal: b.dal, dongu: b.dongu,
        merkez: b.merkez === null ? null : dugumId[b.merkez]
      };
    });

    // iz düzeyi özetler
    var dugumSiraliNes = dugumSirasi.map(function (x) { return dugumNes[x]; });
    var kenarSiraliNes = kenarSirasi.map(function (x) { return kenarNes[x]; });
    var kaynakListe = [];
    kenarSiraliNes.forEach(function (k) { k.kaynaklar.forEach(function (s) { kaynakListe.push(s); }); });
    dugumSiraliNes.forEach(function (d) { d.kaynaklar.forEach(function (s) { kaynakListe.push(s); }); });
    var semalar = gercekSemalar.slice().sort(function (a, b) { return db._semaNo[a] - db._semaNo[b]; });
    var dg = ic().dogrulandiMi(db, semalar);

    // başlık
    var baslik;
    if (kimlik.tur === 'kablo') baslik = 'Kablo ' + kimlik.kablo.etiket;
    else {
      var etiketler = [];
      var kokId = bilesenNes[0].odak || bilesenNes[0].baslangic;
      kenarSiraliNes.forEach(function (k) { if (k.a === kokId || k.b === kokId) { if (k.etiket != null && etiketler.indexOf(k.etiket) < 0) etiketler.push(k.etiket); } });
      baslik = etiketler.length ? 'Kablo ' + etiketler.join(' / ') : 'Kablo (etiketsiz)';
    }

    return {
      tur: kimlik.tur, baslik: baslik, sorgu: kimlik.sorgu,
      kablo: kimlik.kablo ? { anahtar: kimlik.kablo.anahtar, no: kimlik.kablo.no, etiket: kimlik.kablo.etiket, isaret: kimlik.kablo.isaret, parcaSayisi: kimlik.kablo.parcalar.length } : null,
      bilesenler: bilesenNes, dugumler: dugumSiraliNes, kenarlar: kenarSiraliNes,
      dal: bilesenNes.some(function (b) { return b.dal; }), dongu: bilesenNes.some(function (b) { return b.dongu; }),
      sayilar: {
        kablo: kenarSiraliNes.filter(function (k) { return !k.sanal && !k.ic; }).length,   // kablo (kendine dönen kablolar dahil)
        sanal: kenarSiraliNes.filter(function (k) { return k.sanal; }).length,
        ic: kenarSiraliNes.filter(function (k) { return k.ic; }).length,
        kendineDonen: kenarSiraliNes.filter(function (k) { return k.kendineDonen; }).length
      },
      kaynaklar: ic().kaynakTekil(db, kaynakListe), semalar: semalar,
      dogrulandi: dg.dogrulandi, dogrulanmamisSemalar: dg.dogrulanmamisSemalar,
      supheli: kenarSiraliNes.some(function (k) { return k.supheli; }) || dugumSiraliNes.some(function (d) { return d.belirsiz; }),
      celiski: uyarilar.some(function (u) { return u.tur === 'celiski'; }),
      uyarilar: uyarilar, sinirAsildi: g.sinirAsildi
    };
  }

  // ---- 8. genel işlevler -------------------------------------------------------------------------------------------
  function bulGrup(db, anahtar) {
    if (anahtar == null) return null;
    var s = String(anahtar);
    if (db._kablo[s]) return db._kablo[s];
    var k = kabloAnahtari(s);
    if (db._kablo[k]) return db._kablo[k];
    var liste = db._kabloAra[k];
    return liste && liste.length ? liste[0] : null;
  }

  /** Kablo no / etiket / anahtar → iz. */
  function kablo(db, anahtar, opts) {
    var g = bulGrup(db, anahtar);
    if (!g) return null;
    return kurIz(db, { tur: 'kablo', sorgu: { anahtar: g.anahtar }, kablo: g }, g.parcalar.slice(), null, opts);
  }

  /** Bir uçtan (cihaz pini, ara soket pini, ek noktası, ya da anahtarsız uç) → iz. */
  function uc(db, ref, opts) {
    if (!ref) return null;
    var tohum = [], odak = null, sorgu = null, vkey = null;
    if (ref.parca != null) {
      var p = db._parcaUid[ref.parca];
      if (!p) return null;
      var i = ref.uc === 1 ? 1 : 0;
      tohum = [p]; odak = { uid: p.uid, uc: i }; sorgu = { parca: p.uid, uc: i };
    } else {
      if (ref.dugum != null) {
        var kod = String(ref.dugum);
        vkey = 'D|' + (kod.charAt(0) === '~' ? (ref.sema || '') + '|' : '') + norm(kod);
        sorgu = { dugum: kod };
      } else if (ref.cihaz != null && ref.pin != null) {

    } else if (tur === 'dugum') {
      u.kod = str(e.kod);
      if (!u.kod) return null;
      u.belirsiz = belirsiz(u.kod);
    } else {
      u.cihaz = str(e.cihaz); u.hedef = str(e.hedef);
      if (!u.cihaz && !u.hedef) return null;
      u.cihazN = u.cihaz ? norm(u.cihaz) : null;
      u.hedefP = hedefCoz(u.hedef);
      u.yolNo = u.hedefP ? null : yolNoCoz(u.hedef);
      u.belirsiz = belirsiz(u.cihaz) || belirsiz(u.hedef);
    }
    u.vkey = ucAnahtari(sema, u);
    return u;
  }

  /** Kablo grup anahtarı: numaralıysa numara, numarasızsa etiket, ikisi de yoksa null. */
  function grupAnahtari(no, etiket) {
    if (no != null && String(no) !== '') return kabloAnahtari(no);
    if (etiket != null && String(etiket) !== '') return 'etiket:' + norm(etiket);
    return null;
  }

  function soketPinSayisi(soket, ara) {
    if (ara || soket == null) return null;
    var m = /-(\d+)$/.exec(soket) || /^(\d+)$/.exec(soket);
    return m ? parseInt(m[1], 10) : null;
  }

  // ---- yükleme -------------------------------------------------------------------------------
  function yukle(paket) {
    paket = paket || {};
    var db = {
      surum: 1, imza: paket.imza || null,
      meta: { surum: paket.meta && typeof paket.meta.surum === 'string' ? paket.meta.surum : null },   // 'dagitim' | 'dogrulama' | null (build.py gömer)
      semaSirasi: [], sekmeler: [], semalar: {}, eksikSemalar: {}, istatistik: {}, ornekler: {}, uyarilar: [],
      _parcalar: [], _parcaUid: {}, _vertex: {}, _kablo: {}, _kabloListe: [], _kabloAra: {},
      _cihaz: {}, _cihazListe: [], _cihazUc: {}, _soketMap: {}, _soketListe: [], _celiskiler: [],
      _sekmeSema: {}, _semaSekme: {}, _semaNo: {}, _kaynakOnbellek: {}
    };
    var uyar = function (tur, sema, id, mesaj) { db.uyarilar.push({ tur: tur, sema: sema || null, id: id || null, mesaj: mesaj }); };

    // paket.veri: nesne ya da dizi
    var veri = {};
    if (Array.isArray(paket.veri)) {
      paket.veri.forEach(function (d) { if (d && d.sema) veri[d.sema] = d; });
    } else if (paket.veri && typeof paket.veri === 'object') {
      Object.keys(paket.veri).forEach(function (k) { veri[k] = paket.veri[k]; });
    }
    var meta = paket.semalar || {};

    // şema sırası: yapılandırma sırası, sonra yapılandırmada olmayanlar
    var sira = Object.keys(meta).filter(function (id) { return veri[id]; });
    Object.keys(veri).forEach(function (id) { if (sira.indexOf(id) < 0) sira.push(id); });
    Object.keys(meta).forEach(function (id) {
      if (!veri[id]) {
        db.eksikSemalar[id] = { id: id, ad: meta[id].ad || id, pdf: meta[id].pdf || null, sayfalar: meta[id].sayfalar || [], kapak: meta[id].kapak || [], dilim: meta[id].dilim == null ? null : meta[id].dilim };
        uyar('sema-yok', id, null, 'Şema verisi yok, atlandı: ' + id);
      }
    });
    db.semaSirasi = sira;
    sira.forEach(function (id, i) { db._semaNo[id] = i; });

    // sekmeler
    var sekmeler = Array.isArray(paket.sekmeler) && paket.sekmeler.length ? paket.sekmeler
      : sira.map(function (id) { return { id: id, ad: (meta[id] && meta[id].ad) || id, semalar: [id] }; });
    sekmeler.forEach(function (t) {
      var tum = t.semalar || [];
      var yuklu = tum.filter(function (id) { return veri[id]; });
      db.sekmeler.push({ id: t.id, ad: t.ad || t.id, semalar: yuklu, eksikSemalar: tum.filter(function (id) { return !veri[id]; }) });
      db._sekmeSema[t.id] = yuklu;
      yuklu.forEach(function (id) { if (!db._semaSekme[id]) db._semaSekme[id] = t.id; });
    });

    // her şema: meta + parçalar + cihaz listesi
    var cihazListeleri = {};
    sira.forEach(function (id) {
      var d = veri[id], m = meta[id] || {}, k = d.kaynak || {};
      db.semalar[id] = {
        id: id, ad: m.ad || id, pdf: m.pdf || k.pdf || null,
        sayfalar: m.sayfalar || k.sayfalar || [], kapak: m.kapak || [], dilim: m.dilim == null ? null : m.dilim,
        sekme: db._semaSekme[id] || null, dogrulandi: d.dogrulandi === true,
        kunye: d.kunye || null, varsayilan: d.varsayilan || null,
        parcaSayisi: 0, cihazSayisi: 0, supheSayisi: 0, celiskiSayisi: 0, icSayisi: 0, kendineDonenSayisi: 0
      };
      cihazListeleri[id] = Array.isArray(d.cihazlar) ? d.cihazlar : [];
      var bl = {};
      (Array.isArray(d.celiskiler) ? d.celiskiler : []).forEach(function (c) {
        if (c && c.kablo != null) (bl[c.kablo] = bl[c.kablo] || []).push(c);
      });
      var kablolar = Array.isArray(d.kablolar) ? d.kablolar : [];
      var kullanilanBL = {};
      kablolar.forEach(function (h, n) {
        var pid = h && h.id != null ? String(h.id) : '#' + n;
        var uid = id + ':' + pid;
        if (!h || !Array.isArray(h.uclar) || h.uclar.length !== 2) { uyar('parca-bozuk', id, pid, 'Kablo parçası atlandı: tam iki ucu yok'); return; }
        var u0 = ucKur(id, h.uclar[0]), u1 = ucKur(id, h.uclar[1]);
        if (!u0 || !u1) { uyar('parca-bozuk', id, pid, 'Kablo parçası atlandı: uç eksik ya da tanınmayan türde'); return; }
        if (db._parcaUid[uid]) { uyar('parca-tekrar', id, pid, 'Aynı kimlikli ikinci kayıt atlandı'); return; }
        var iz = h.izgara || {};
        var yol = iz.yol == null ? null : String(iz.yol);
        var p = {
          uid: uid, sema: id, id: pid,
          etiket: str(h.etiket), no: str(h.no), isaret: str(h.isaret), kesit: str(h.kesit), renk: str(h.renk),
          varyant: h.varyant === true, durum: h.durum || 'eslesti', not: str(h.not), suphe: h.suphe || null,
          izgara: { sayfa: iz.sayfa == null ? null : iz.sayfa, yol: yol, satir: iz.satir == null ? null : String(iz.satir) },
          yolN: yol == null ? null : yol.replace(/^~/, ''),
          uclar: [u0, u1], grup: null, sira: db._parcalar.length, bl: bl[pid] || [],
          ic: h.ic === true,                                        // cihaz içi köprü: kablo değil
          kendineDonen: !!(u0.vkey && u0.vkey === u1.vkey)          // iki ucu aynı soket-pin (bilinçli veri, ör. Gelenk soketi)
        };
        if (bl[pid]) kullanilanBL[pid] = true;
        // cihaz içi köprü kablo grubu kurmaz: kablo aramasında ve kablo sayılarında görünmez
        p.grup = p.ic ? null : grupAnahtari(p.no, p.etiket);
        if (p.ic) {
          db.semalar[id].icSayisi++;
          if (!(u0.tur === 'cihaz' && u1.tur === 'cihaz' && u0.cihazN === u1.cihazN)) {
            uyar('ic-uc', id, pid, 'ic:true kayıtta iki uç aynı cihazın pini değil; yine de cihaz içi bağlantı sayıldı');
          }
        }
        if (p.kendineDonen) db.semalar[id].kendineDonenSayisi++;
        p.supheli = p.durum === 'suphe' || belirsiz(p.etiket) || belirsiz(p.no) || u0.belirsiz === true || u1.belirsiz === true;
        db._parcalar.push(p);
        db._parcaUid[uid] = p;
        db.semalar[id].parcaSayisi++;
        if (p.durum === 'suphe') db.semalar[id].supheSayisi++;
        [u0, u1].forEach(function (u, i) {
          if (u.vkey) (db._vertex[u.vkey] = db._vertex[u.vkey] || []).push({ p: p, i: i });
        });
      });
      Object.keys(bl).forEach(function (kid) {
        if (!kullanilanBL[kid]) uyar('celiski-kaydi', id, kid, 'celiskiler kaydındaki kablo bulunamadı: ' + kid);
      });
    });

    kablolariKur(db);
    cihazlariKur(db, cihazListeleri);
    gecisleriKur(db);
    soketleriKur(db);
    celiskileriBul(db);
    istatistikHesapla(db);
    sekmeSayilari(db);
    return db;
  }

  /** Sekme başına sayaçlar: arayüz boş sekmeyi ("bu sistemin verisi henüz yok") ve rozetleri bunlardan çizer. */
  function sekmeSayilari(db) {
    db.sekmeler.forEach(function (t) {
      var k = {};
      t.semalar.forEach(function (s) { k[s] = true; });
      var kesisir = function (semalar) { return semalar.some(function (s) { return k[s] === true; }); };
      var parca = 0, suphe = 0, dogrulanmamis = 0;
      t.semalar.forEach(function (s) {
        parca += db.semalar[s].parcaSayisi;
        suphe += db.semalar[s].supheSayisi;
        if (!db.semalar[s].dogrulandi) dogrulanmamis++;
      });
      t.veriVar = t.semalar.length > 0;
      t.parcaSayisi = parca;
      t.kabloSayisi = db._kabloListe.filter(function (g) { return kesisir(g.semalar); }).length;
      t.cihazSayisi = db._cihazListe.filter(function (r) { return kesisir(r.semalar); }).length;
      t.supheSayisi = suphe;
      t.dogrulandi = t.semalar.length > 0 && dogrulanmamis === 0;
    });
  }

  function kablolariKur(db) {
    db._parcalar.forEach(function (p) {
      if (!p.grup) return;
      var g = db._kablo[p.grup];
      if (!g) {
        g = db._kablo[p.grup] = {
          anahtar: p.grup, no: null, etiket: null, isaret: null, etiketler: [], parcalar: [],
          semalar: [], cihazlar: [], supheli: false, celiski: false, araAnahtarlari: []
        };
        db._kabloListe.push(g);
      }
      g.parcalar.push(p);
    });
    db._kabloListe.forEach(function (g) {
      var etiketler = [], semalar = [], cihazlar = [], cihazKod = {};
      g.parcalar.forEach(function (p) {
        if (p.etiket != null && etiketler.indexOf(p.etiket) < 0) etiketler.push(p.etiket);
        if (semalar.indexOf(p.sema) < 0) semalar.push(p.sema);
        if (p.no != null && g.no == null) g.no = p.no;
        if (p.isaret) g.isaret = p.isaret;
        if (p.supheli) g.supheli = true;
        p.uclar.forEach(function (u) {
          if (u.tur === 'cihaz' && !cihazKod[norm(u.cihaz)]) { cihazKod[norm(u.cihaz)] = true; cihazlar.push(u.cihaz); }
        });
      });
      semalar.sort(function (a, b) { return db._semaNo[a] - db._semaNo[b]; });
      g.etiketler = etiketler;
      g.semalar = semalar;
      g.cihazlar = cihazlar.sort(dogal);
      // numaralıda '#' işareti ayrı alandır; numarasız etikette ('#br', '#2,5br') etiketin kendisi zaten '#' ile başlar
      g.etiket = g.no != null ? (g.isaret ? g.isaret : '') + g.no : (etiketler[0] || '');
      // arama anahtarları: numara ve her etiketin normalize hâli
      var an = [];
      if (g.no != null) an.push(kabloAnahtari(g.no));
      etiketler.forEach(function (e) { an.push(arama(e)); an.push(kabloAnahtari(e)); });
      g.araAnahtarlari = tekil(an);
      g.araAnahtarlari.forEach(function (k) {
        var liste = db._kabloAra[k] = db._kabloAra[k] || [];
        if (liste.indexOf(g) < 0) liste.push(g);
      });
    });
    db._kabloListe.sort(function (a, b) {
      // numaralılar önce, sonra etiketliler; doğal sıra ('#' sıralamayı etkilemez)
      var an = a.no != null ? 0 : 1, bn = b.no != null ? 0 : 1;
      return an !== bn ? an - bn : dogal(a.no != null ? a.no : a.etiketler[0] || '', b.no != null ? b.no : b.etiketler[0] || '');
    });
  }

  function cihazKaydi(db, kod) {
    var n = norm(kod);
    var r = db._cihaz[n];
    if (!r) {
      r = db._cihaz[n] = {
        kod: kod, kodN: n, kisaAd: null, adTr: null, adDe: null, cihazTur: null, cihazBilinmiyor: true,
        yol: {}, semalar: [], celiski: [], not: null, supheli: false, soketSayisi: 0, pinSayisi: 0, _listede: false, gecis: false
      };
      db._cihazListe.push(r);
    }
    return r;
  }

  function cihazlariKur(db, listeler) {
    var alanDegerleri = {}; // 'kodN|alan' → { sema: değer }
    function semaEkle(r, sema) {
      if (r.semalar.indexOf(sema) < 0) r.semalar.push(sema);
    }
    db.semaSirasi.forEach(function (sema) {
      (listeler[sema] || []).forEach(function (c) {
        var kod = c && str(c.kod);
        if (!kod) return;
        var r = cihazKaydi(db, kod);
        r._listede = true;
        r.cihazBilinmiyor = false;
        semaEkle(r, sema);
        r.yol[sema] = (Array.isArray(c.yol) ? c.yol : (c.yol == null ? [] : [c.yol])).map(String);
        var yeni = { kisaAd: str(c.kisaAd), adTr: str(c.adTr), adDe: str(c.adDe), cihazTur: str(c.tur), not: str(c.not) };
        if (yeni.cihazTur && TURLER.indexOf(yeni.cihazTur) < 0) yeni.cihazTur = 'diger';
        Object.keys(yeni).forEach(function (alan) {
          var v = yeni[alan];
          if (v == null) return;
          var anahtar = r.kodN + '|' + alan;
          (alanDegerleri[anahtar] = alanDegerleri[anahtar] || {})[sema] = v;
          if (r[alan] == null) r[alan] = v; // ilk dolu değer kalır (build.py'deki cihazlar.json ile aynı kural)
        });
      });
    });
    // şemalar arası alan çelişkileri
    Object.keys(alanDegerleri).forEach(function (k) {
      var degerler = alanDegerleri[k];
      var farkli = tekil(Object.keys(degerler).map(function (s) { return degerler[s]; }));
      if (farkli.length > 1) {
        var parca = k.split('|');
        db._cihaz[parca[0]].celiski.push({ alan: parca[1], degerler: degerler });
      }
    });
    // uçlardan: bilinmeyen cihaz kayıtları, uç dizini, şema listesi
    db._parcalar.forEach(function (p) {
      p.uclar.forEach(function (u, i) {
        if (u.tur !== 'cihaz') return;
        var r = cihazKaydi(db, u.cihaz);
        semaEkle(r, p.sema);
        (db._cihazUc[r.kodN] = db._cihazUc[r.kodN] || []).push({ p: p, i: i });
        if (p.supheli) r.supheli = true;
      });
    });
    db._cihazListe.forEach(function (r) {
      if (!r._listede) r.cihazTur = turdenKod(r.kod);
      else if (!r.cihazTur) r.cihazTur = 'diger';
      r.semalar.sort(function (a, b) { return db._semaNo[a] - db._semaNo[b]; });
      var soketler = {}, pinler = {};
      (db._cihazUc[r.kodN] || []).forEach(function (x) {
        var u = x.p.uclar[x.i];
        soketler[norm(u.soket || '')] = true;
        pinler[u.vkey || (x.p.uid + '#' + x.i)] = true;
      });
      r.soketSayisi = Object.keys(soketler).length;
      r.pinSayisi = Object.keys(pinler).length;
    });
    db._cihazListe.sort(function (a, b) { return dogal(a.kod, b.kod); });
    db.semaSirasi.forEach(function (sema) { db.semalar[sema].cihazSayisi = 0; });
    db._cihazListe.forEach(function (r) { r.semalar.forEach(function (s) { db.semalar[s].cihazSayisi++; }); });
  }

  // ---- geçiş bileşenleri (API.md §4.9) -----------------------------------------------------------------
  /** Türü sigorta / diyot / direnç / şalter olan ve veride TAM İKİ AYRI ucu (terminali) bulunan cihazlar için, iz o cihazdan geçebilsin diye
      iki ucu arasında "sanal parça" kurar. Terminal = aynı uç anahtarlı uçlar tek terminaldir (pinli: aynı soket+pin);
      pini yazılmayan ya da '?' içeren her uç AYRI bir terminaldir (yanlışlıkla birleşmez). İkiden az/çok terminalli cihaz (potansiyometre, 3 pinli şalter),
      cihaz içi köprü (ic) taşıyan cihaz ve başka türler geçiş sayılmaz. */
  function gecisleriKur(db) {
    db._gecis = {};
    db._cihazListe.forEach(function (r) {
      if (!Object.prototype.hasOwnProperty.call(GECIS_TURLERI, r.cihazTur)) return;
      var harita = {}, terminaller = [], icVar = false;
      (db._cihazUc[r.kodN] || []).forEach(function (x) {
        if (x.p.ic) icVar = true;
        var u = x.p.uclar[x.i];
        var an = u.vkey || (x.p.uid + '#' + x.i);
        var t = harita[an];
        if (!t) { t = harita[an] = { vkey: u.vkey || null, uclar: [] }; terminaller.push(t); }
        t.uclar.push({ p: x.p, i: x.i });
      });
      if (icVar || terminaller.length !== 2) return;
      var ucNesnesi = function (t) {
        var u = t.uclar[0].p.uclar[t.uclar[0].i], pinAdi = null;
        t.uclar.forEach(function (x) { var v = x.p.uclar[x.i]; if (pinAdi == null && v.pinAdi != null) pinAdi = v.pinAdi; });
        return {
          tur: 'cihaz', ham: null, cihaz: u.cihaz, soket: u.soket, pin: u.pin, pinAdi: pinAdi, cihazN: u.cihazN,
          belirsiz: t.uclar.some(function (x) { return x.p.uclar[x.i].belirsiz === true; }),
          vkey: t.vkey, sanalUc: true, gercek: t.uclar
        };
      };
      var turAd = GECIS_TURLERI[r.cihazTur];
      var sanal = {
        uid: 'sanal:' + r.kodN, sema: terminaller[0].uclar[0].p.sema, id: 'sanal:' + r.kodN, sanal: true, ic: false, kendineDonen: false,
        etiket: null, no: null, isaret: null, kesit: null, renk: null, varyant: false, durum: 'eslesti', not: null, suphe: null,
        izgara: { sayfa: null, yol: null, satir: null }, yolN: null,
        uclar: [ucNesnesi(terminaller[0]), ucNesnesi(terminaller[1])], grup: null, sira: -1, bl: [], supheli: false,
        bilesen: {
          kod: r.kod, tur: r.cihazTur, turAd: turAd, ad: r.kisaAd ? r.kisaAd + ' (' + r.kod + ')' : r.kod,
          kisaAd: r.kisaAd, adTr: r.adTr, adDe: r.adDe, cihazBilinmiyor: r.cihazBilinmiyor
        }
      };
      terminaller.forEach(function (t) {
        t.uclar.forEach(function (x) { x.p.uclar[x.i].gecisKod = r.kodN; });
      });
      r.gecis = true;
      db._gecis[r.kodN] = { kodN: r.kodN, kod: r.kod, tur: r.cihazTur, turAd: turAd, terminaller: terminaller, sanal: sanal };
    });
  }

  function soketleriKur(db) {
    db._parcalar.forEach(function (p) {
      p.uclar.forEach(function (u, i) {
        var ara, cihaz;
        if (u.tur === 'cihaz' && u.soket != null) { ara = false; cihaz = u.cihaz; }
        else if (u.tur === 'soket') { ara = true; cihaz = null; }
        else return;
        var anahtar = (cihaz ? norm(cihaz) : '') + '|' + norm(u.soket);
        var e = db._soketMap[anahtar];
        if (!e) {
          e = db._soketMap[anahtar] = {
            soket: u.soket, soketN: norm(u.soket), cihaz: cihaz, cihazN: cihaz ? norm(cihaz) : null, ara: ara,
            pinSayisi: soketPinSayisi(u.soket, ara), uclar: [], semalar: [], supheli: false, pinler: {}
          };
          db._soketListe.push(e);
        }
        e.uclar.push({ p: p, i: i });
        if (e.semalar.indexOf(p.sema) < 0) e.semalar.push(p.sema);
        if (p.supheli) e.supheli = true;
        if (u.pin != null) e.pinler[u.vkey || (p.uid + '#' + i)] = true;
        else e.pinler[p.uid + '#' + i] = true;
      });
    });
    db._soketListe.forEach(function (e) {
      e.semalar.sort(function (a, b) { return db._semaNo[a] - db._semaNo[b]; });
      e.bagliPinSayisi = Object.keys(e.pinler).length;
    });
    db._soketListe.sort(function (a, b) { return dogal(a.soket, b.soket) || dogal(a.cihaz || '', b.cihaz || ''); });
  }

  // ---- çelişkiler ----------------------------------------------------------------------------
  function semaAdi(db, id) { return db.semalar[id] ? db.semalar[id].ad : id; }

  function celiskileriBul(db) {
    var liste = db._celiskiler;
    var isaretle = function (grup) { if (db._kablo[grup]) db._kablo[grup].celiski = true; };

    // 1) aynı cihaz pininde farklı numaralı kablolar
    Object.keys(db._vertex).forEach(function (vk) {
      if (vk.charAt(0) !== 'C') return;
      var gruplar = [], parcalar = [];
      db._vertex[vk].forEach(function (r) {

      m.donen.satirlar.forEach(function (t, i) { B.yazi(g, x, y0 + B.satir('i') * (i + 0.5), t, 'i', 'dy-yz2'); });
    }
    return {
      kart: function (o) {
        var soketVar = secenek && secenek.soketGoster && spec.soket != null;
        var soketW = soketVar ? 20 + 4 + B.parcaGen(B.parcala(spec.soket), 'p') : 0;
        var satirW = m.boxW + (m.adVar ? 10 + m.adW : 0);
        var w = Math.max((secenek && secenek.minW) || 0, satirW, soketW, m.donen ? m.donen.w : 0) + 8;
        var rz = sup ? I.rozet(B, 'supheli') : null;
        var ph = pinH(B), y = 4, bY = y; y += ph;
        var sY = null; if (soketVar) { sY = y; y += Math.max(28, B.satir('p') + 4); }
        var zY = null; if (rz) { y += 2; zY = y; y += rz.h; }
        var dY = null; if (m.donen) { y += 4; dY = y; y += m.donen.satirlar.length * B.satir('i'); }
        var h = y + 4;
        w = Math.max(w, rz ? rz.w + 8 : 0);
        return {
          w: Math.ceil(w), h: Math.ceil(h), telY: bY + ph / 2,
          ciz: function (g, x, y0) {
            var gp = B.dokun(g, 'uc', spec.uc, spec, { x: x, y: y0, w: Math.ceil(w), h: Math.ceil(h) }, aria());
            pinKutuCiz(B, gp, spec, m, x + 4, y0 + bY + ph / 2);
            if (m.adVar) B.yaziCiz(gp, x + 4 + m.boxW + 10, y0 + bY + ph / 2, spec.pinAdi, 'pa');
            if (soketVar) { var sh = Math.max(28, B.satir('p') + 4); B.ikon(gp, 'i-soket', x + 4, y0 + sY + (sh - 20) / 2, 20, 'ik-yazi'); B.yaziCiz(gp, x + 28, y0 + sY + sh / 2, spec.soket, 'p'); }
            if (rz) rz.ciz(gp, x + 4, y0 + zY);

      },
      blok: function (o) {
        var left = Math.max(MARJ, o.spineX - m.boxW / 2), right = left + m.boxW;
        var tx = Math.max(o.xMetin, right + 10);
        var soketVar = secenek && secenek.soketGoster && spec.soket != null;
        var rz = sup ? I.rozet(B, 'supheli') : null;
        var ph = pinH(B), y = ph, sY = null, zY = null, dY = null;
        if (soketVar) { y += 2; sY = y; y += Math.max(24, B.satir('p') + 2); }
        if (rz) { y += 4; zY = y; y += rz.h; }
        if (m.donen) { y += 4; dY = y; y += m.donen.satirlar.length * B.satir('i'); }
        return {
          h: Math.ceil(y), ikonY: ph / 2,
          ciz: function (g, y0) {
            var gp = B.dokun(g, 'uc', spec.uc, spec, { x: o.spineX - 24, y: y0, w: (o.xMetin + o.maksW) - (o.spineX - 24), h: Math.ceil(y) }, aria());
            pinKutuCiz(B, gp, spec, m, left, y0 + ph / 2);
            if (m.adVar) B.yaziCiz(gp, tx, y0 + ph / 2, spec.pinAdi, 'pa');
            if (soketVar) { var sh = Math.max(24, B.satir('p') + 2); B.ikon(gp, 'i-soket', tx, y0 + sY + (sh - 20) / 2, 20, 'ik-yazi'); B.yaziCiz(gp, tx + 24, y0 + sY + sh / 2, spec.soket, 'p'); }
            if (rz) rz.ciz(gp, tx, y0 + zY);
